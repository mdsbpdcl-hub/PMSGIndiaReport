<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Surya Ghar – Bihar in India</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e4e7ec; --line2:#f0f2f5; --ink:#101828; --muted:#5d6b82; --faint:#98a2b3; --track:#eef1f5;
  --hi:#e8590c; --hiT:#fff4ec; --base:#9db4cf; --base2:#6f8db3; --ref:#344054;
  --g:#15803d; --gm:#16a34a; --gt:#ecfdf3; --a:#b45309; --am:#d97706; --at:#fffbeb; --r:#b42318; --rm:#dc2626; --rt:#fef3f2; --n:#5d6b82; --nt:#f2f4f7;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,#fff3e8 0,#fdf8f3 220px,#f6f7f9 520px) no-repeat,#f6f7f9;font-family:Inter,"Segoe UI",Roboto,system-ui,sans-serif;color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px 48px}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.badge{width:36px;height:36px;border-radius:9px;background:var(--hiT);color:var(--hi);display:grid;place-items:center;flex:none;border:1px solid #fde3d0}
.ttl{min-width:0;flex:1 1 240px}
.ttl h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.005em}
.ttl .ason{font-size:12.5px;color:var(--muted)}
.pills{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.pills button{border:0;background:#fff;padding:7px 13px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.pills button+button{border-left:1px solid var(--line)}
.pills button.on{background:var(--ink);color:#fff}
.refresh{border:1px solid var(--line);color:var(--ink);background:#fff;padding:7px 12px;border-radius:8px;font-weight:500;font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer}
.refresh:hover{background:var(--line2)}
.refresh svg{width:15px;height:15px}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 16px -10px rgba(16,24,40,.12)}
.sec{margin-top:16px}
.sec h2{font-size:15px;margin:0 0 2px;font-weight:650}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.grid{display:grid;gap:16px}
.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media(max-width:980px){.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:560px){.wrap,.hbar{padding-left:14px;padding-right:14px}.refresh span{display:none}}
/* headline band */
.head{margin-top:18px;display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:0;padding:0;overflow:hidden}
@media(max-width:860px){.head{grid-template-columns:minmax(0,1fr)}}
.rankbox{padding:22px;border-right:1px solid var(--line);background:radial-gradient(260px 180px at 0% 0%,#ffe6d3,transparent 70%),linear-gradient(180deg,#fff,#fff8f2)}
@media(max-width:860px){.rankbox{border-right:0;border-bottom:1px solid var(--line)}}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rankbig{font-size:52px;font-weight:700;line-height:1;margin-top:8px;color:var(--hi);letter-spacing:-.02em}
.rankbig small{font-size:16px;color:var(--muted);font-weight:500;letter-spacing:0}
.rankbox .line2{margin-top:8px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.m{padding:18px 20px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);min-width:0}
.m .l{font-size:12.5px;color:var(--muted);font-weight:500}
.m .v{font-size:26px;font-weight:700;margin-top:4px;line-height:1.15;letter-spacing:-.01em}
.m .v small{font-size:13.5px;color:var(--muted);font-weight:500}
.m .ex{font-size:12.5px;color:var(--muted);margin-top:4px}
.m .add{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:var(--g);background:var(--gt);padding:1px 8px;border-radius:99px}
.bullet{grid-column:1/-1;padding:16px 20px}
.bullet .t{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;margin-bottom:8px}
.bt{position:relative;height:14px;background:var(--track);border-radius:3px}
.bt .f{position:absolute;left:0;top:0;bottom:0;background:var(--hi);border-radius:3px;width:0;transition:width .9s ease}
.bt .mk{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ref)}
.bt .mk span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--ref);white-space:nowrap}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:4px}
.line2{color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--nt);color:var(--n);white-space:nowrap;border:1px solid transparent}
.chip.g{background:var(--gt);color:var(--g)} .chip.a{background:var(--at);color:var(--a)} .chip.r{background:var(--rt);color:var(--r)}
.chip.t{background:#fff;color:var(--ink);border-color:var(--line)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
/* facts */
.facts{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media(max-width:1180px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);padding:12px 14px;min-width:0}
.fact .l{font-size:12px;color:var(--muted);line-height:1.3}
.fact .x{font-size:18px;font-weight:700;margin-top:3px;overflow-wrap:anywhere}
/* bars */
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) minmax(0,80px);gap:10px;align-items:center;font-size:13px;cursor:pointer;border-radius:6px;padding:2px 4px}
.hb:hover{background:var(--line2)}
.hb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{height:12px;background:transparent;border-radius:2px;overflow:hidden}
.hb .f{height:100%;border-radius:0 3px 3px 0;background:var(--base);width:0;transition:width .9s ease}
.hb.me .f{background:var(--hi)}
.hb.me .n,.hb.me .val{font-weight:700;color:var(--hi)}
.hb .val{text-align:right;font-weight:600}
.gap{border-top:1px dashed var(--line);margin:4px 0}
/* strip chart */
.strip{position:relative;height:150px;margin:26px 8px 6px}
.strip .ax{position:absolute;left:0;right:0;top:70px;height:1px;background:var(--line)}
.strip .tk{position:absolute;top:66px;width:1px;height:9px;background:#cfd5de}
.strip .tl{position:absolute;top:112px;font-size:11px;color:var(--faint);transform:translateX(-50%)}
.strip .dt{position:absolute;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);background:var(--base);border:2px solid #fff;cursor:pointer;box-shadow:0 0 0 1px rgba(16,24,40,.06)}
.strip .dt.free{background:#fff;border:2px solid var(--base2)}
.strip .dt.me{width:15px;height:15px;background:var(--hi);border-color:#fff;z-index:2;box-shadow:0 0 0 2px var(--hi)}
.strip .ref{position:absolute;top:10px;bottom:46px;width:0;border-left:2px dashed var(--ref)}
.strip .lab{position:absolute;font-size:11.5px;font-weight:600;transform:translateX(-50%);white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%}
.cmp{display:flex;flex-direction:column;gap:12px}
.cmp .row .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;gap:8px}
.cmp .tr{height:10px;background:var(--track);border-radius:2px;overflow:hidden}
.cmp .f{height:100%;border-radius:2px;width:0;transition:width .9s ease}
/* ranking list */
.rk{display:flex;flex-direction:column}
.rkr{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,92px);gap:10px;align-items:center;cursor:pointer;padding:8px 4px;border-bottom:1px solid var(--line2)}
.rkr:last-child{border-bottom:0}
.rkr:hover{background:var(--line2)}
.num{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--nt);color:var(--muted)}
.rkr.me{background:var(--hiT)}
.rkr.me .num{background:var(--hi);color:#fff}
.rkr .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkr .cx{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkr .bar{height:4px;background:var(--track);border-radius:2px;margin-top:4px;overflow:hidden}
.rkr .bar i{display:block;height:100%;background:var(--base)}
.rkr.me .bar i{background:var(--hi)}
.rkr .vv{text-align:right;font-weight:700;font-size:13.5px}
.rkr .vv small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
/* table */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input{border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:inherit;font-size:13.5px;min-width:0;flex:1 1 200px;max-width:300px}
.bands{display:flex;gap:6px;flex-wrap:wrap}
.bands button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--muted)}
.bands button.on{border-color:var(--ink);color:#fff;background:var(--ink)}
.tbox{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:980px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
th{background:#f9fafb;color:var(--muted);font-weight:600;font-size:12px;cursor:pointer;user-select:none;position:sticky;top:0;border-bottom:1px solid var(--line)}
th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left}
td:nth-child(3){white-space:normal;min-width:180px;max-width:250px;color:var(--muted);font-size:12px}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f9fafb}
tr.me{background:var(--hiT)!important;box-shadow:inset 3px 0 0 var(--hi)}
tr.me td{font-weight:700}
tr.tot td{font-weight:700;background:#f9fafb;border-top:1px solid var(--line)}
th .ar{color:var(--hi)}
/* insights */
.ins{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.in{padding:11px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.in:last-child{border-bottom:0}
.in .h{font-weight:650;margin-bottom:2px;font-size:13px;color:var(--ink)}
.in{color:#344054}
/* trend */
.trend{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px;border-bottom:1px solid var(--line)}
.tb{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.tb i{display:block;width:100%;max-width:24px;border-radius:3px 3px 0 0;background:var(--hi);height:0;transition:height .9s}
.tb span{font-size:10.5px;color:var(--faint);white-space:nowrap}
.tip{position:fixed;pointer-events:none;background:#fff;border-radius:8px;border:1px solid var(--line);box-shadow:0 8px 24px -10px rgba(16,24,40,.25);padding:7px 10px;font-size:12.5px;z-index:60;display:none;max-width:260px}
.state{display:grid;place-items:center;min-height:50vh}
.state .card{text-align:center;max-width:380px}
.spin{width:30px;height:30px;border:3px solid var(--track);border-top-color:var(--hi);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.btn2{border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;margin-top:10px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.25);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(500px,100%);background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;overflow-x:hidden;border-left:1px solid var(--line)}
.drawer.on{transform:none}
.dh{position:sticky;top:0;background:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:2}
.dh h3{margin:0;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;flex:none}
.db{padding:16px;display:flex;flex-direction:column;gap:12px}
.dk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dk .m{padding:14px}
.dk .m .v{font-size:21px}
.vs{min-width:0!important;font-size:13px}

/* metric icons */
.m .l{display:flex;align-items:center;gap:8px}
.mi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.mi svg{width:16px;height:16px}
/* tile map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media(max-width:980px){.mapwrap{grid-template-columns:minmax(0,1fr)}}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.tmap{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;max-width:560px;margin:6px auto 0}
.tile{aspect-ratio:1/1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;font-weight:700;font-size:clamp(9px,1.2vw,13px);line-height:1.1;transition:transform .15s, box-shadow .15s;min-width:0}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 14px -6px rgba(16,24,40,.35);z-index:2}
.tile small{font-weight:500;font-size:clamp(7.5px,.85vw,10.5px);opacity:.85;margin-top:1px}
.tile.me{outline:3px solid var(--hi);outline-offset:1px;z-index:3}
.tile .fz{position:absolute;top:3px;right:3px;width:clamp(9px,1vw,12px);height:clamp(9px,1vw,12px);color:inherit;opacity:.9}
.scale{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.scale .sw{display:flex;border-radius:4px;overflow:hidden}
.scale .sw i{width:26px;height:10px;display:block}
/* ladder */
.ladder{display:flex;flex-direction:column;gap:6px}
.lr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line2);border-radius:10px;cursor:pointer;background:#fff}
.lr:hover{background:var(--line2)}
.lr .rn{font-weight:700;color:var(--muted);font-size:13px}
.lr .sn{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .sv{font-weight:700;font-size:13.5px;text-align:right}
.lr .sv small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.lr.me{background:linear-gradient(90deg,#fff1e6,#fff);border-color:#fbd3b5;box-shadow:inset 3px 0 0 var(--hi)}
.lr.me .rn,.lr.me .sn{color:var(--hi)}
.lgap{font-size:11.5px;color:var(--muted);text-align:center;margin:-2px 0}
.sech{display:flex;align-items:center;gap:8px}
.sech .dotc{width:8px;height:8px;border-radius:50%;background:var(--hi)}

/* free electricity section */
.freesec{background:linear-gradient(180deg,#fffaf3,#fff 160px)}
.fbadge{width:34px;height:34px;border-radius:10px;background:#fff1e0;display:grid;place-items:center;font-size:17px;flex:none;border:1px solid #fde1bf}
.sech{align-items:flex-start}
.ftypes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
@media(max-width:980px){.ftypes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ft{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer;min-width:0}
.ft:hover{border-color:#cfd5de}
.ft.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ft .tt{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650}
.ft .tt i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.ft .tn{font-size:24px;font-weight:700;margin-top:4px;line-height:1.1}
.ft .tn small{font-size:12.5px;color:var(--muted);font-weight:500}
.ft .ts{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft .tc{font-size:12px;margin-top:6px;color:#344054}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:1100px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.fc{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;position:relative;overflow:hidden;min-width:0;transition:box-shadow .15s,transform .15s}
.fc:hover{box-shadow:0 8px 20px -12px rgba(16,24,40,.3);transform:translateY(-1px)}
.fc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--fcol)}
.fc.me{border-color:#fbc9a3;background:linear-gradient(180deg,#fff5ec,#fff 120px);box-shadow:0 0 0 2px #fde0c8}
.fc .top{display:flex;align-items:flex-start;gap:10px}
.fc .rb{min-width:34px;height:34px;border-radius:10px;background:var(--nt);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted);flex:none;padding:0 4px}
.fc.me .rb{background:var(--hi);color:#fff}
.fc .nm{font-weight:700;font-size:15px;line-height:1.25}
.fc .scheme{font-size:12px;color:var(--muted)}
.fc .units{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.fc .units b{font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--fcolT)}
.fc .units span{font-size:12.5px;color:var(--muted)}
.fc dl{display:grid;grid-template-columns:78px minmax(0,1fr);gap:4px 10px;margin:0;font-size:12.5px}
.fc dt{color:var(--faint);font-weight:500}
.fc dd{margin:0;color:#344054}
.fc .perf{border-top:1px solid var(--line2);padding-top:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fc .perf div{min-width:0}
.fc .perf .pl{font-size:11px;color:var(--faint)}
.fc .perf .pv{font-size:14.5px;font-weight:700}
.fc .cbar{grid-column:1/-1;position:relative;height:7px;background:var(--track);border-radius:4px}
.fc .cbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.fc .cbar s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ref)}
.fnote{margin-top:14px;font-size:12.5px;color:#7a4b12;background:#fff8ec;border:1px solid #fbe3bd;border-left:4px solid #e3a21a;border-radius:10px;padding:10px 12px}
.insw{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
@media(max-width:820px){.insw{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){#fseg{display:none}}

function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false;} else f+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f);rows.push(row);row=[];f=''; }
    else f+=c; }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x!==''));
}

function build(rows){
  const h=rows[0].map(x=>String(x).toLowerCase().trim());
  const fi=(re,not)=>h.findIndex(x=>re.test(x)&&!(not&&not.test(x)));
  const I={state:fi(/state/),free:fi(/free/),apps:fi(/applica/),inst:fi(/install/,/capacity|added|since/),conv:fi(/conversion/),mw:fi(/capacity/),kw:fi(/avg/),cr:fi(/subsidy|cfa/),add:fi(/added|since/)};
  if(I.state<0||I.inst<0) throw new Error('cols');

  if(lu>=0&&rows[0][lu+1]) asOn=String(rows[0][lu+1]).replace(/\s*IST$/,'');

    const o={state:String(r[I.state]||'').trim(),freeTxt:I.free>=0?String(r[I.free]||''):'',apps:num(r[I.apps]),inst:num(r[I.inst]),

    o.cat=cat(o.freeTxt); o.conv=o.apps?o.inst/o.apps*100:null; o.kw=(o.mw&&o.inst)?o.mw*1000/o.inst:null; o.pend=o.apps!=null?Math.max(0,o.apps-o.inst):null;

  T.conv=T.inst/T.apps*100; T.kw=T.mw*1000/T.inst;
  return {list,T,fr,asOn};
}

function histFrom(rows){
  const h=rows[0].map(x=>x.toLowerCase()); const iD=h.indexOf('date'), iS=h.findIndex(x=>/state/.test(x)), iI=h.findIndex(x=>/install/.test(x));
  if(iD<0||iS<0||iI<0) return null;
  const by={}; rows.slice(1).forEach(r=>{const d=r[iD]; if(!d) return; by[d]=by[d]||{}; by[d][String(r[iS]).toLowerCase()]=num(r[iI]);});

function drawInsights(me,next,prev,atNat,rankAtNat){
  const {list,T,fr}=S;
  const top3=list.slice(0,3), top3s=top3.reduce((s,o)=>s+o.inst,0)/T.inst*100;
  const frA=fr.reduce((s,o)=>s+(o.apps||0),0), frI=fr.reduce((s,o)=>s+o.inst,0);
  const nf=list.filter(o=>o.cat==='no'), nfA=nf.reduce((s,o)=>s+(o.apps||0),0), nfI=nf.reduce((s,o)=>s+o.inst,0);
  const appRank=rankBy(list,'apps',me);
  const sizeGap=me.kw&&T.kw?(1-me.kw/T.kw)*100:null;
  const meShareFrApps=frA?me.apps/frA*100:0;
  const out=[
    ['Where Bihar stands',`Bihar is <b>${ord(me.rank)}</b> in India with <b>${fmt(me.inst)}</b> installations${next?`, <b>${fmt(next.inst-me.inst+1)}</b> behind ${esc(next.state)} (${ord(me.rank-1)})`:''}${prev?` and <b>${fmt(me.inst-prev.inst)}</b> ahead of ${esc(prev.state)}`:''}.`],
    ['Demand is not the problem',`Bihar is <b>${ord(appRank)}</b> in applications (${lakh(me.apps)}) but only <b>${f1(me.conv)}%</b> are installed, against <b>${f1(T.conv)}%</b> for India. <b>${lakh(me.pend)}</b> applications are waiting.`],
    ['If Bihar matched India',`At India's conversion rate Bihar would have about <b>${lakh(atNat)}</b> installations – <b>${ord(rankAtNat)}</b> in India instead of ${ord(me.rank)}.`],
    ['Free power states',`States giving free electricity have turned <b>${f1(frA?frI/frA*100:0)}%</b> of applications into installations, against <b>${f1(nfA?nfI/nfA*100:0)}%</b> in other states. Bihar alone holds <b>${f1(meShareFrApps)}%</b> of all applications in free power states.`],
    ['Smaller systems',sizeGap!=null?`An average Bihar system is <b>${f2(me.kw)} kW</b>, ${sizeGap>0?`<b>${f1(sizeGap)}%</b> smaller than`:'about the same as'} the India average of ${f2(T.kw)} kW – so each installation adds less capacity and subsidy.`:''],
    ['Concentration in India',`The top three states – ${top3.map(o=>esc(o.state)).join(', ')} – have <b>${f1(top3s)}%</b> of all installations in India.`]

  if(me.add!=null&&!isNaN(me.add)&&T.add) out.splice(1,0,['Since the last update',`Bihar added <b>${fmt(me.add)}</b> installations, <b>${f1(me.add/T.add*100)}%</b> of all additions in India.`]);

}

     <button class="ib" id="dp" aria-label="Previous">‹</button><button class="ib" id="dn" aria-label="Next">›</button></div>
   <div class="db">
     <div class="chips" style="margin:0"><span class="chip t">${ord(o.rank)} in India</span>${o.frank?`<span class="chip t">${ord(o.frank)} of free power states</span>`:''}<span class="chip ${st.c}"><i></i>${st.t}</span></div>
     <div class="dk">
       ${metric('Applications',fmt(o.apps),'',`${lakh(o.pend)} waiting`)}
       ${metric('Installations',fmt(o.inst),'',`${f1(o.conv)}% of applications`,o.add)}
       ${metric('Capacity',f1(o.mw),' MW',`${f2(o.kw)} kW per house`)}
       ${metric('Subsidy','₹'+f1(o.cr),' crore',o.inst?`₹${fmt(o.cr*1e7/o.inst)} per house`:'')}
     </div>
     <div class="card" style="padding:14px"><div style="font-weight:600;margin-bottom:6px">Free electricity</div><div class="line2" style="margin:0">${esc(o.freeTxt||'No')}</div></div>
     <div class="card" style="padding:14px"><div style="font-weight:600;margin-bottom:6px">Compared</div>
       <div class="tbox"><table class="vs"><thead><tr><th style="text-align:left"></th><th>${esc(o.state)}</th>${isMe(o)?'':'<th>Bihar</th>'}<th>India</th></tr></thead><tbody>
       ${row('Installed %',o.conv,me.conv,T.conv,f1)}${row('Avg system (kW)',o.kw,me.kw,T.kw,f2)}${row('Installations',o.inst,me.inst,T.inst,fmt)}${row('Applications',o.apps,me.apps,T.apps,fmt)}
       </tbody></table></div></div>
   </div>`;
  $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); $('#drawer').setAttribute('aria-hidden','false');
  $('#dx').onclick=closeDrawer; $('#dp').onclick=()=>move(-1); $('#dn').onclick=()=>move(1);
  setTimeout(()=>document.querySelectorAll('#drawer [data-w]').forEach(e=>e.style.width=e.dataset.w),30);
}
function move(d){ const L=S.list; openDrawer(L[(dIdx+d+L.length)%L.length].state); }
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); $('#drawer').setAttribute('aria-hidden','true'); }
$('#scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{ if(!$('#drawer').classList.contains('on')) return; if(e.key==='Escape') closeDrawer(); if(e.key==='ArrowRight') move(1); if(e.key==='ArrowLeft') move(-1); });

/* ============================ misc ============================ */
function tipify(sel){ const tip=$('#tip'); document.querySelectorAll(sel).forEach(el=>{
  el.onmousemove=e=>{tip.textContent=el.dataset.tip; tip.style.display='block'; tip.style.left=Math.min(innerWidth-250,e.clientX+12)+'px'; tip.style.top=(e.clientY+14)+'px';};
  el.onmouseleave=()=>tip.style.display='none'; }); }
function countUp(){ document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count; if(reduce){el.textContent=fmt(to);return;}
  const t0=performance.now(); const step=t=>{const p=Math.min(1,(t-t0)/1100); el.textContent=fmt(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step);}; requestAnimationFrame(step);}); }

document.querySelectorAll('.pills button').forEach(b=>b.onclick=()=>{ scope=b.dataset.scope; document.querySelectorAll('.pills button').forEach(x=>x.classList.toggle('on',x===b)); band='all'; if(S){ drawTop(); drawBands(); drawTable(); setTimeout(()=>document.querySelectorAll('#topbars [data-w]').forEach(e=>e.style.width=e.dataset.w),30);} });
$('#refresh').onclick=load;
load();
</script>
</body>
</html>
