header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.72);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid rgba(231,234,240,.8)}

.ttl{min-width:0;flex:1 1 220px}
.ttl h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}

.pills{display:flex;background:#eceef3;border-radius:99px;padding:3px;gap:2px;flex-wrap:wrap}

.dots{display:flex;gap:8px}

.refresh{border:0;color:#fff;background:linear-gradient(135deg,var(--t1),var(--t2));padding:9px 14px;border-radius:12px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;cursor:pointer;box-shadow:0 8px 18px -10px var(--t1)}

.state{display:grid;place-items:center;min-height:50vh}
.state .card{text-align:center;max-width:380px}
.spin{width:34px;height:34px;border:3px solid var(--track);border-top-color:var(--t1);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.btn2{border:0;background:linear-gradient(135deg,var(--t1),var(--t2));color:#fff;font-weight:600;padding:9px 16px;border-radius:10px;cursor:pointer;margin-top:10px}

.scrim{position:fixed;inset:0;background:rgba(29,36,51,.28);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:#f7f8fb;z-index:50;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.7,.2,1);overflow-y:auto;overflow-x:hidden}
.drawer.on{transform:none}
.dh{position:sticky;top:0;background:rgba(255,255,255,.8);backdrop-filter:blur(14px);padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:2}
.dh h3{margin:0;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:1px solid var(--line);background:#fff;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none}
.db{padding:16px;display:flex;flex-direction:column;gap:12px}
.dk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dk .kpi{padding:14px}
.dk .kpi .v{font-size:22px}
.vs{width:100%;min-width:0;font-size:13.5px}
.vs td,.vs th{padding:7px 8px}
.vs{min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const csvUrl = sheet => `https://docs.google.com/spreadsheets/d/${DATA_ID}/gviz/tq?tqx=out:csv&headers=1${sheet?'&sheet='+encodeURIComponent(sheet):''}&_=${Date.now()}`;
async function getRows(sheet){
  const r=await fetch(csvUrl(sheet),{cache:'no-store'}); if(!r.ok) throw new Error('http');
  const t=await r.text(); if(/^\s*</.test(t)) throw new Error('html'); return parseCSV(t);
}
function cat(txt){const s=String(txt||'').toLowerCase(); if(s.startsWith('yes')) return 'free'; if(s.startsWith('linked')) return 'solar'; if(s.startsWith('targeted')) return 'targeted'; return 'no';}

function build(rows){
  const h=rows[0].map(x=>String(x).toLowerCase().trim());
  const fi=(re,not)=>h.findIndex(x=>re.test(x)&&!(not&&not.test(x)));
  const I={state:fi(/state/),free:fi(/free/),apps:fi(/applica/),inst:fi(/install/,/capacity|added|since/),conv:fi(/conversion/),mw:fi(/capacity/),kw:fi(/avg/),cr:fi(/subsidy|cfa/),add:fi(/added|since/)};
  if(I.state<0||I.inst<0) throw new Error('cols');
  let asOn=null; const lu=h.findIndex(x=>x.startsWith('last updated'));
  if(lu>=0&&rows[0][lu+1]) asOn=String(rows[0][lu+1]).replace(/\s*IST$/,'');
  const list=rows.slice(1).map(r=>{
    const o={state:String(r[I.state]||'').trim(),freeTxt:I.free>=0?String(r[I.free]||''):'',apps:num(r[I.apps]),inst:num(r[I.inst]),
      mw:I.mw>=0?num(r[I.mw]):null,cr:I.cr>=0?num(r[I.cr]):null,add:I.add>=0?num(r[I.add]):null};
    o.cat=cat(o.freeTxt); o.conv=o.apps?o.inst/o.apps*100:null; o.kw=(o.mw&&o.inst)?o.mw*1000/o.inst:null; o.pend=o.apps!=null?Math.max(0,o.apps-o.inst):null;
    return o;}).filter(o=>o.state&&o.inst!=null&&!/^(india|total|grand)/i.test(o.state));
  list.sort((a,b)=>b.inst-a.inst); list.forEach((o,i)=>o.rank=i+1);
  const fr=list.filter(o=>o.cat==='free'); fr.forEach((o,i)=>o.frank=i+1);
  const T={apps:0,inst:0,mw:0,cr:0,add:0}; list.forEach(o=>{T.apps+=o.apps||0;T.inst+=o.inst;T.mw+=o.mw||0;T.cr+=o.cr||0;T.add+=o.add||0;});
  T.conv=T.inst/T.apps*100; T.kw=T.mw*1000/T.inst;
  return {list,T,fr,asOn};
}

async function load(){
  showState('load');
  try{
    let rows; try{ rows=await getRows('State-wise'); build(rows);}catch(e){ rows=await getRows(''); }
    const d=build(rows); d.live=true;
    try{ d.hist=histFrom(await getRows('History')); }catch(e){ d.hist=null; }
    S=d;
  }catch(e){
    if(SNAPSHOT&&SNAPSHOT.rows){ S=build(SNAPSHOT.rows); S.asOn=S.asOn||SNAPSHOT.asOn; S.live=false; S.hist=null; }
    else { showState('error'); return; }
  }
  if(!S.list.length){ showState('empty'); return; }
  if(!S.asOn) S.asOn=SNAPSHOT.asOn;
  render();
}
function histFrom(rows){
  const h=rows[0].map(x=>x.toLowerCase()); const iD=h.indexOf('date'), iS=h.findIndex(x=>/state/.test(x)), iI=h.findIndex(x=>/install/.test(x));
  if(iD<0||iS<0||iI<0) return null;
  const by={}; rows.slice(1).forEach(r=>{const d=r[iD]; if(!d) return; by[d]=by[d]||{}; by[d][String(r[iS]).toLowerCase()]=num(r[iI]);});
  const days=Object.keys(by).sort(); return days.length?{days,by}:null;
}
function showState(k){

}

function rankBy(list,k,o){ return list.filter(x=>x[k]!=null&&x[k]>o[k]).length+1; }

function kpi(k,name,val,unit,ex,add){
  const col={apps:'var(--apps)',inst:'var(--inst)',cap:'var(--cap)',cfa:'var(--cfa)'}[k], tint={apps:'var(--appsT)',inst:'var(--instT)',cap:'var(--capT)',cfa:'var(--cfaT)'}[k];
  return `<div class="kpi" style="background:linear-gradient(160deg,#fff 30%,${tint})">

    ${add!=null&&!isNaN(add)?`<span class="pill" style="color:${col}">${add>=0?'+':''}${fmt(add)} since last update</span>`:''}</div>`;
}
function fact(ic,l,x){ return `<div class="fact"><div class="ic">${IC[ic]}</div><div style="min-width:0"><div class="l">${l}</div><div class="x">${x}</div></div></div>`; }

function dialSVG(v,avg){
  const cx=160,cy=160,r=118, a=p=>Math.PI*(1-p/100), P=p=>[cx+r*Math.cos(a(p)),cy-r*Math.sin(a(p))];
  const arc=(p0,p1)=>{const [x0,y0]=P(p0),[x1,y1]=P(p1);return `M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}`;};
  const vv=Math.max(0,Math.min(100,v||0)), deg=-90+vv*1.8;
  const ticks=[0,25,50,75,100].map(p=>{const [x,y]=[cx+(r+20)*Math.cos(a(p)),cy-(r+20)*Math.sin(a(p))];const [x1,y1]=[cx+(r-16)*Math.cos(a(p)),cy-(r-16)*Math.sin(a(p))];const [x2,y2]=[cx+(r-24)*Math.cos(a(p)),cy-(r-24)*Math.sin(a(p))];
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#c9ced8" stroke-width="2" stroke-linecap="round"/><text x="${x}" y="${y+4}" font-size="11" fill="#98a2b3" text-anchor="middle">${p}%</text>`;}).join('');
  const [mx,my]=P(Math.min(100,avg)), [mx2,my2]=[cx+(r+9)*Math.cos(a(avg)),cy-(r+9)*Math.sin(a(avg))];
  return `<svg class="dial" viewBox="0 0 320 190" role="img" aria-label="Bihar ${f1(v)} percent, India ${f1(avg)} percent">
   <defs><linearGradient id="dg" x1="0" x2="1"><stop offset="0" style="stop-color:var(--t1)"/><stop offset="1" style="stop-color:var(--t2)"/></linearGradient></defs>
   <path d="${arc(0,100)}" fill="none" stroke="#eef0f5" stroke-width="18" stroke-linecap="round"/>
   ${vv>0.5?`<path d="${arc(0,vv)}" fill="none" stroke="url(#dg)" stroke-width="18" stroke-linecap="round"/>`:''}
   ${ticks}
   <line x1="${mx}" y1="${my}" x2="${mx2}" y2="${my2}" stroke="#1d2433" stroke-width="3" stroke-linecap="round"/>
   <text x="${mx2}" y="${my2-6}" font-size="11" fill="#1d2433" text-anchor="middle" font-weight="600">India</text>
   <g id="needle" data-deg="${deg}" style="transform-origin:${cx}px ${cy}px;transform:rotate(-90deg);transition:transform 1.2s cubic-bezier(.2,.7,.2,1)">
     <path d="M${cx-5} ${cy} L${cx} ${cy-r+28} L${cx+5} ${cy} Z" fill="#1d2433"/></g>
   <circle cx="${cx}" cy="${cy}" r="9" fill="#1d2433"/><circle cx="${cx}" cy="${cy}" r="3.5" fill="#fff"/>
   <text x="${cx}" y="${cy-38}" font-size="26" font-weight="700" fill="#1d2433" text-anchor="middle">${f1(v)}%</text>
  </svg>`;
}

function drawInsights(me,next,prev,atNat,rankAtNat){

  const meShareFrApps=frA?me.apps/frA*100:0;

    ['Where Bihar stands',`Bihar is <b>${ord(me.rank)}</b> in India with <b>${fmt(me.inst)}</b> installations${next?`, <b>${fmt(next.inst-me.inst+1)}</b> behind ${esc(next.state)} (${ord(me.rank-1)})`:''}${prev?` and <b>${fmt(me.inst-prev.inst)}</b> ahead of ${esc(prev.state)}`:''}.`],

    ['Smaller systems',sizeGap!=null?`An average Bihar system is <b>${f2(me.kw)} kW</b>, ${sizeGap>0?`<b>${f1(sizeGap)}%</b> smaller than`:'about the same as'} the India average of ${f2(T.kw)} kW – so each installation adds less capacity and subsidy.`:''],

}

function drawTrend(){
  const H=S.hist; if(!H||H.days.length<2) return;
  const days=H.days.slice(-21), vals=days.map(d=>H.by[d][HOME]??Object.entries(H.by[d]).find(([k])=>k.includes(HOME))?.[1]).map(v=>v??null);
  const mx=Math.max(...vals.filter(v=>v!=null)), mn=Math.min(...vals.filter(v=>v!=null))*0.98;
  $('#trendSec').style.display='';
  $('#trend').innerHTML=days.map((d,i)=>{const v=vals[i];const hgt=v==null?0:Math.max(4,(v-mn)/(mx-mn||1)*100);
    const dd=new Date(d+'T00:00:00'); const lab=isNaN(dd)?d:dd.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
    const add=i&&v!=null&&vals[i-1]!=null?v-vals[i-1]:null;
    return `<div class="tb" data-tip="${lab}: ${fmt(v)}${add!=null?` (+${fmt(add)})`:''}"><i data-h="${hgt}%"></i><span>${lab}</span></div>`;}).join('');
  tipify('#trend .tb');
}

function drawBands(){
  const L=scoped(); const cnt=k=>k==='all'?L.length:L.filter(o=>status(o).t===k).length;
  const B=[['all','All'],['Ahead','Ahead'],['Near average','Near average'],['Behind','Behind']];
  $('#bands').innerHTML=B.map(([k,t])=>`<button class="${band===k?'on':''}" data-b="${k}">${t} (${cnt(k)})</button>`).join('');
  $('#bands').onclick=e=>{const b=e.target.closest('button'); if(!b) return; band=b.dataset.b; drawBands(); drawTable();};
}

const COLS=[['rank','Rank'],['state','State / UT'],['freeTxt','Free electricity'],['apps','Applications'],['inst','Installations'],['conv','Installed %'],['status','Status'],['mw','Capacity (MW)'],['kw','Avg kW'],['cr','Subsidy (₹ crore)'],['add','Added since last update']];
function drawTable(){
  let L=scoped().slice();
  if(band!=='all') L=L.filter(o=>status(o).t===band);
  if(query) L=L.filter(o=>o.state.toLowerCase().includes(query.toLowerCase()));
  const val=(o,k)=>k==='status'?status(o).t:o[k];
  L.sort((a,b)=>{const x=val(a,sortKey),y=val(b,sortKey); if(typeof x==='string'||typeof y==='string') return sortDir*String(x).localeCompare(String(y)); return sortDir*((x??-1e18)-(y??-1e18));});
  const sc=scope==='free';
  const head=`<thead><tr>${COLS.map(([k,t])=>`<th data-k="${k}">${k==='rank'&&sc?'Rank (free)':t}${sortKey===k?` <span class="ar">${sortDir>0?'▲':'▼'}</span>`:''}</th>`).join('')}</tr></thead>`;
  const body=L.map(o=>{const st=status(o);return `<tr class="${isMe(o)?'me':''}" data-s="${esc(o.state)}">
    <td>${sc?o.frank:o.rank}</td><td>${esc(o.state)}</td><td>${esc(o.freeTxt||'No')}</td><td>${fmt(o.apps)}</td><td>${fmt(o.inst)}</td><td>${f1(o.conv)}</td>
    <td style="text-align:left"><span class="chip ${st.c}"><i></i>${st.t}</span></td><td>${f1(o.mw)}</td><td>${f2(o.kw)}</td><td>${f2(o.cr)}</td><td>${o.add==null||isNaN(o.add)?'–':(o.add>=0?'+':'')+fmt(o.add)}</td></tr>`;}).join('');
  const G=scoped(); const t={apps:0,inst:0,mw:0,cr:0}; G.forEach(o=>{t.apps+=o.apps||0;t.inst+=o.inst;t.mw+=o.mw||0;t.cr+=o.cr||0;});
  const tot=`<tr class="tot"><td></td><td>${sc?'Free power states':'India'}</td><td></td><td>${fmt(t.apps)}</td><td>${fmt(t.inst)}</td><td>${f1(t.inst/t.apps*100)}</td><td></td><td>${f1(t.mw)}</td><td>${f2(t.mw*1000/t.inst)}</td><td>${f2(t.cr)}</td><td></td></tr>`;
  $('#tbl').innerHTML=head+`<tbody>${body}${band==='all'&&!query?tot:''}</tbody>`;
  $('#tbl thead').onclick=e=>{const th=e.target.closest('th'); if(!th) return; const k=th.dataset.k; if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir=(k==='state'||k==='freeTxt'||k==='status'||k==='rank')?1:-1;} drawTable();};
  $('#tbl tbody').onclick=e=>{const tr=e.target.closest('tr[data-s]'); if(tr) openDrawer(tr.dataset.s);};
}

/* ============================ drawer ============================ */
let dIdx=-1;
function openDrawer(name){
  const L=S.list; dIdx=L.findIndex(o=>o.state===name); if(dIdx<0) return;
  const o=L[dIdx], me=L.find(isMe), T=S.T, st=status(o);
  const row=(l,a,b,c,f)=>`<tr><td style="text-align:left">${l}</td><td><b>${f(a)}</b></td>${isMe(o)?'':`<td>${f(b)}</td>`}<td>${f(c)}</td></tr>`;
  $('#drawer').innerHTML=`<div class="dh"><button class="ib" id="dx" aria-label="Close">✕</button><h3>${esc(o.state)}</h3>
     <button class="ib" id="dp" aria-label="Previous">‹</button><button class="ib" id="dn" aria-label="Next">›</button></div>
   <div class="db">
     <div class="chips" style="justify-content:flex-start;margin:0"><span class="chip t">${ord(o.rank)} in India</span>${o.frank?`<span class="chip t">${ord(o.frank)} of free power states</span>`:''}<span class="chip ${st.c}"><i></i>${st.t}</span></div>
     <div class="dk">
       ${kpi('apps','Applications',fmt(o.apps),'',`${lakh(o.pend)} waiting`,null)}
       ${kpi('inst','Installations',fmt(o.inst),'',`${f1(o.conv)}% of applications`,o.add)}
       ${kpi('cap','Capacity',f1(o.mw),' MW',`${f2(o.kw)} kW per house`,null)}
       ${kpi('cfa','Subsidy',f1(o.cr),' crore',o.inst?`₹${fmt(o.cr*1e7/o.inst)} per house`:'',null)}
     </div>
     <div class="card" style="padding:14px"><div style="font-weight:600;margin-bottom:6px">Free electricity</div><div class="line2" style="margin:0">${esc(o.freeTxt||'No')}</div></div>
     <div class="card" style="padding:14px"><div style="font-weight:600;margin-bottom:6px">Compared</div>
       <div class="tbox"><table class="vs"><thead><tr><th style="text-align:left"></th><th>${esc(o.state)}</th>${isMe(o)?'':'<th>Bihar</th>'}<th>India</th></tr></thead><tbody>
       ${row('Installed %',o.conv,me.conv,T.conv,f1)}${row('Avg system (kW)',o.kw,me.kw,T.kw,f2)}${row('Installations',o.inst,me.inst,T.inst,fmt)}${row('Applications',o.apps,me.apps,T.apps,fmt)}
       </tbody></table></div></div>
   </div>`;
  $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); $('#drawer').setAttribute('aria-hidden','false');
  $('#dx').onclick=closeDrawer; $('#dp').onclick=()=>move(-1); $('#dn').onclick=()=>move(1);
  setTimeout(()=>document.querySelectorAll('#drawer [data-w]').forEach(e=>e.style.width=e.dataset.w),30);
}
function move(d){ const L=S.list; openDrawer(L[(dIdx+d+L.length)%L.length].state); }
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); $('#drawer').setAttribute('aria-hidden','true'); }
$('#scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{ if(!$('#drawer').classList.contains('on')) return; if(e.key==='Escape') closeDrawer(); if(e.key==='ArrowRight') move(1); if(e.key==='ArrowLeft') move(-1); });

/* ============================ misc ============================ */
function tipify(sel){ const tip=$('#tip'); document.querySelectorAll(sel).forEach(el=>{
  el.onmousemove=e=>{tip.textContent=el.dataset.tip; tip.style.display='block'; tip.style.left=Math.min(innerWidth-250,e.clientX+12)+'px'; tip.style.top=(e.clientY+14)+'px';};
  el.onmouseleave=()=>tip.style.display='none'; }); }
function countUp(){ document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count; if(reduce){el.textContent=fmt(to);return;}
  const t0=performance.now(); const step=t=>{const p=Math.min(1,(t-t0)/1100); el.textContent=fmt(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step);}; requestAnimationFrame(step);}); }

document.querySelectorAll('.pills button').forEach(b=>b.onclick=()=>{ scope=b.dataset.scope; document.querySelectorAll('.pills button').forEach(x=>x.classList.toggle('on',x===b)); band='all'; if(S){ drawTop(); drawBands(); drawTable(); setTimeout(()=>document.querySelectorAll('#topbars [data-w]').forEach(e=>e.style.width=e.dataset.w),30);} });
$('#refresh').onclick=load;
load();
</script>
</body>
