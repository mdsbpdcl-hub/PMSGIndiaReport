name: Daily PM Surya Ghar update

# Runs on YOUR office PC (self-hosted runner) because pmsuryaghar.gov.in
# only answers Indian internet connections. No pull_request trigger, so
# nobody else can run code on that PC.
on:
  schedule:
    - cron: "41 3 * * *"     # 09:11 IST every day
  workflow_dispatch:          # "Run workflow" button

concurrency:
  group: pmsg-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install / update Python packages
        run: |
          python -m pip install --upgrade --quiet playwright pandas openpyxl
          python -m playwright install chromium

      - name: Read portal and update the sheet
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
        run: python scraper/pmsg_portal_scraper.py --headless

      - name: Keep today's Excel/CSV files (downloadable for 30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PMSG-Data-${{ github.run_number }}
          path: scraper/PMSG_Data/
          retention-days: 30
          if-no-files-found: ignore
